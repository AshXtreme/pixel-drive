plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pixeldrive.emulator'
    compileSdk 34

    defaultConfig {
        applicationId "com.pixeldrive.emulator"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.2.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        debug {
            // Uses standard default debug keystore
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // Standalone native activity requires no extra Java runtime dependencies
}
