[package]
name = "pixel-drive"
version = "1.0.0"
edition = "2021"
authors = ["PixelDrive Team"]
description = "Unified macOS Handheld Emulator in Rust"

[dependencies]
winit = { version = "0.29", features = ["rwh_05"] }
pixels = "0.15"
log = "0.4"
env_logger = "0.11"
zip = "2.1"
libloading = "0.8"
cpal = "0.15"
ringbuf = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = { version = "0.27", default-features = false, features = ["links"] }
rfd = "0.14"



