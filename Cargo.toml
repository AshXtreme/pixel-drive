[package]
name = "pixel-drive"
version = "1.2.1"
edition = "2021"
authors = ["PixelDrive Team"]
description = "High-Performance Unified Handheld Emulator (macOS, Windows, Android)"

[lib]
name = "pixeldrive"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "pixeldrive"
path = "src/main.rs"

[dependencies]
winit = { version = "0.29", features = ["rwh_05"] }
pixels = "0.15"
log = "0.4"
env_logger = "0.11"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
libloading = "0.8"
cpal = "0.15"
ringbuf = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = { version = "0.27", default-features = false, features = ["links"] }
bytemuck = { version = "1.16", features = ["derive"] }
thiserror = "1.0"
parking_lot = "0.12"
raw-window-handle = "0.6"
pollster = "0.3"
crc32fast = "1.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.5", features = ["native-activity"] }
ndk = { version = "0.8", features = ["rwh_05"] }
ndk-sys = "0.5"
jni = "0.21"
android_logger = "0.14"
winit = { version = "0.29", default-features = false, features = ["android-native-activity", "rwh_05"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
